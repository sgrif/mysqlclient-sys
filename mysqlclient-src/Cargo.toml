[package]
name = "mysqlclient-src"
version = "0.2.4+26.10.0"
edition = "2021"
build = "build.rs"
description = "Bundled version of libmysqlclient"
license = "GPL-2.0-only"
documentation = "https://docs.rs/mysqlclient-src/"
repository = "https://github.com/sgrif/mysqlclient-sys"
links = "mysqlclient_sys_src"
keywords = ["bindings", "libmysqlclient", "mysqlclient-sys", "bundled"]
categories = ["database", "external-ffi-bindings"]

include = [
   "/build.rs",
   "/src",
   "/source/CMakeLists.txt",
   "/source/config.h.cmake",
   "/source/configure.cmake",
   "/source/cmake",
   "/source/include",
   "/source/MYSQL_VERSION",
   "/source/extra/libbacktrace",
   "/source/extra/zlib",
   "/source/extra/zstd",
   "/source/extra/libevent",
   "/source/extra/lz4",
   "/source/extra/rapidjson",
   "/source/extra/libedit",
   "/source/extra/libcno",
   "/source/extra/xxhash",
   "/source/strings",
   "/source/vio",
   "/source/mysys",
   "/source/libmysql",
   # The optional client authentication plugins are disabled in build.rs
   # (`WITH_AUTHENTICATION_CLIENT_PLUGINS=OFF`), their CMakeLists.txt files
   # are still read by cmake, but return early without referencing any sources
   "!/source/libmysql/authentication_kerberos/**",
   "!/source/libmysql/authentication_ldap/**",
   "!/source/libmysql/authentication_oci_client/**",
   "!/source/libmysql/authentication_openid_connect_client/**",
   "!/source/libmysql/authentication_webauthn/**",
   "/source/libmysql/authentication_kerberos/CMakeLists.txt",
   "/source/libmysql/authentication_ldap/CMakeLists.txt",
   "/source/libmysql/authentication_oci_client/CMakeLists.txt",
   "/source/libmysql/authentication_openid_connect_client/CMakeLists.txt",
   "/source/libmysql/authentication_webauthn/CMakeLists.txt",
   # Unused since the native password plugin is built into libmysqlclient again
   "!/source/libmysql/authentication_native_password",
   "/source/mysql",
   "/source/libchangestreams",
   "/source/storage/ndb/cmake",
   "/source/storage/ndb/CMakeLists.txt",
   "/source/share",
   "/source/libservices",
   "/source/utilities",
   "/source/client",
   "/source/components/libminchassis",
   "/source/router/src/harness/include",
   "/source/router/cmake",
   "/source/sql/",
   "/source/sql-common/",
   "/source/libs/mysql",
   "/source/man",
   "/source/scripts/mysqlclient.pc.in",
   "/source/scripts/mysql_config.sh",
   "/source/scripts/mysqldumpslow.pl.in",
   "/source/scripts/mysqld_multi.pl.in",
   "/source/scripts/mysqld_safe.sh",
   "/source/scripts/comp_sql.cc",
   "/source/scripts/CMakeLists.txt",
   "/source/scripts/sys_schema/CMakeLists.txt",
   "/source/packaging/WiX",
   "/source/README",
   "/source/extra/unordered_dense/",
   "/source/Doxyfile.in",
   "/source/components/keyrings/common/component_helpers/src/keyring_log_builtins_definition.cc",
   # Only headers are required from the server sources
   # apart from a few files used by libmysql itself and
   # the client tools (referenced by cmake, even if not built)
   "!/source/sql/**/*.cc",
   "/source/sql/auth/password.cc",
   "/source/sql/auth/sha2_password_common.cc",
   "/source/sql/basic_istream.cc",
   "/source/sql/binlog_istream.cc",
   "/source/sql/binlog_reader.cc",
   "/source/sql/log_event.cc",
   "/source/sql/rpl_gtid_misc.cc",
   "/source/sql/rpl_gtid_set.cc",
   "/source/sql/rpl_gtid_specification.cc",
   "/source/sql/rpl_gtid_tsid_map.cc",
   "/source/sql/rpl_log_encryption.cc",
   "/source/sql/rpl_tblmap.cc",
   "/source/sql/rpl_utility.cc",
   "!/source/sql/sql_yacc.yy",
   "!/source/sql/window.h",
   "!/source/extra/libedit/libedit-20240808-3.1/configure",
   "!/source/extra/libedit/libedit-20240808-3.1/configure.ac",
   "!/source/extra/libedit/libedit-20240808-3.1/ltmain.sh",
   "!/source/man/mysqlbinlog.1",
   "!/source/man/mysql.1",
   "!/source/man/myisamchk.1",
   "!/source/man/mysqlrouter.1",
   "!/source/man/ndb_restore.1",
   "!/source/man/mysqldump.1",
   "!/source/sql/field.h",
   "!/source/sql/gis/srs/srs.h",
   "!/source/sql/item.h",
   "!/source/sql/item_cmpfunc.h",
   "!/source/sql/item_func.h",
   "!/source/sql/item_geofunc.h",
   "!/source/sql/item_strfunc.h",
   "!/source/sql/item_sum.h",
   "!/source/sql/item_timefunc.h",
   "!/source/sql/join_optimizer/access_path.h",
   "!/source/sql/log.h",
   "!/source/sql/parse_tree_nodes.h",
   "!/source/sql/rpl_rli.h",
   "!/source/sql/spatial.h",
   "!/source/sql/sql_lex.h",
   "!/source/sql/sys_vars.h",
   "!/source/sql/table.h",

]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
cmake = "0.1"

[dependencies]
link-cplusplus = "1.0"
openssl-sys = { version = "0.9.93" }

[features]
default = []
with-asan = []
