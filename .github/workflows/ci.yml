on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - master

name: CI Tests
permissions:
  contents: "read"
# See: https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#concurrency.
# This will ensure that only one commit will be running tests at a time on each PR.
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  check_and_test:
    name: Check
    strategy:
      fail-fast: false
      matrix:
        target: [mysql, mariadb]
        os:
          [
            ubuntu-latest,
            ubuntu-24.04-arm,
            macos-15-intel,
            macos-26,
            windows-2025,
          ]
        features: [default, buildtime_bindgen, bundled]
        openssl: ["-F openssl-sys/vendored", ""]
        # Rust target to build for, empty means the native host target.
        # Additional targets are added via `include` below
        rust_target: [""]
        include:
          - target: mysql
            os: windows-2025
            install: vcpkg
            features: buildtime_bindgen
          - target: mariadb
            os: windows-2025
            install: vcpkg
            features: buildtime_bindgen
          # Cross compile the bundled version for musl, there is
          # no system openssl for musl so it needs to be vendored
          - target: mysql
            os: ubuntu-latest
            features: bundled
            openssl: "-F openssl-sys/vendored"
            rust_target: x86_64-unknown-linux-musl
          - target: mysql
            os: ubuntu-24.04-arm
            features: bundled
            openssl: "-F openssl-sys/vendored"
            rust_target: aarch64-unknown-linux-musl
        exclude:
          # Bundled builds never use MariaDB target
          - target: mariadb
            features: bundled
          # The openssl feature is only relevant for bundled builds
          - features: default
            openssl: "-F openssl-sys/vendored"
          - features: buildtime_bindgen
            openssl: "-F openssl-sys/vendored"
          # Building without system openssl isn't useful on Windows hosts
          - os: windows-2025
            openssl: ""
          # too slow, struggles with building mysql
          - os: macos-15-intel
            features: buildtime_bindgen
          - os: macos-15-intel
            features: default

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@f51f967e158417aafa338a1e46ab22095f07aa01 # v2.8.2
        with:
          key: ${{ runner.os }}-${{ matrix.rust_target }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Set environment variables
        shell: bash
        run: |
          echo "RUSTFLAGS=-D warnings" >> $GITHUB_ENV
          echo "RUSTDOCFLAGS=-D warnings" >> $GITHUB_ENV

      - name: Stop current MySQL server
        if: ${{ runner.os == 'Linux' && matrix.target == 'mariadb' }}
        shell: bash
        run: |
          sudo systemctl stop mysql.service
          sudo apt-get purge -y mysql-server

      - name: Install MySQL (Linux)
        if: ${{ runner.os == 'Linux' && matrix.target == 'mysql' && !startsWith(matrix.features, 'bundled') }}
        shell: bash
        run: |
          sudo systemctl start mysql.service
          sudo apt-get update
          sudo apt-get -y install libmysqlclient-dev

      - name: Install MariaDB Client Libs and Server (Linux)
        if: ${{ runner.os == 'Linux' && matrix.target == 'mariadb' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get -y install libmariadb-dev mariadb-server
          sleep 3
          sudo mysql -e 'set password=password("root")'

      - name: Linux env
        if: ${{ runner.os == 'Linux' && !startsWith(matrix.features, 'bundled') }}
        shell: bash
        run: |
          sudo systemctl start mysql.service
          mysql -e "create database diesel_test; create database diesel_unit_test; grant all on \`diesel_%\`.* to 'root'@'localhost';" -uroot -proot
          echo "MYSQL_DATABASE_URL=mysql://root:root@localhost/diesel_test" >> $GITHUB_ENV
          echo "MYSQL_EXAMPLE_DATABASE_URL=mysql://root:root@localhost/diesel_example" >> $GITHUB_ENV
          echo "MYSQL_UNIT_TEST_DATABASE_URL=mysql://root:root@localhost/diesel_unit_test" >> $GITHUB_ENV

      - name: Install MySQL (MacOS Intel)
        if: ${{ matrix.os == 'macos-15-intel' && matrix.target == 'mysql' && !startsWith(matrix.features, 'bundled') }}
        run: |
          brew update
          brew install mysql@8.0
          brew services start mysql@8.0
          sleep 3
          /usr/local/opt/mysql@8.0/bin/mysql -e "create database diesel_test; create database diesel_unit_test;"
          /usr/local/opt/mysql@8.0/bin/mysql -e "create user runner@localhost; grant all on \`diesel_%\`.* to 'runner'@'localhost';"
          echo "PKG_CONFIG_PATH=/usr/local/opt/mysql@8.0/lib/pkgconfig" >> $GITHUB_ENV
          ls /usr/local/opt/mysql@8.0/include/mysql

      - name: Install MariaDB 10.5 (MacOS Intel)
        if: ${{ matrix.os == 'macos-15-intel' && matrix.target == 'mariadb' }}
        run: |
          brew install mariadb@10.6
          echo "PKG_CONFIG_PATH=/usr/local/opt/mariadb@10.6/lib/pkgconfig" >> $GITHUB_ENV

      - name: Install MySQL (MacOS M1)
        if: ${{ matrix.os == 'macos-26' && matrix.target == 'mysql' && !startsWith(matrix.features, 'bundled') }}
        run: |
          brew update
          brew install mysql@8.4
          brew services start mysql@8.4
          sleep 3
          /opt/homebrew/opt/mysql@8.4/bin/mysql -e "create database diesel_test; create database diesel_unit_test;"
          /opt/homebrew/opt/mysql@8.4/bin/mysql -e "create user runner@localhost; grant all on \`diesel_%\`.* to 'runner'@'localhost';"
          echo "MYSQLCLIENT_LIB_DIR=/opt/homebrew/opt/mysql@8.4/lib" >> $GITHUB_ENV
          echo "MYSQLCLIENT_INCLUDE_DIR=/opt/homebrew/opt/mysql@8.4/include/mysql" >> $GITHUB_ENV
          echo "MYSQLCLIENT_VERSION=8.4" >> $GITHUB_ENV

      - name: Install MariaDB latest (MacOS M1)
        if: ${{ matrix.os == 'macos-26' && matrix.target == 'mariadb' }}
        run: |
          brew update
          brew install mariadb@11.4
          ls /opt/homebrew/opt/mariadb@11.4/lib/pkgconfig
          sleep 3
          echo "MYSQLCLIENT_LIB_DIR=/opt/homebrew/opt/mariadb@11.4/lib" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/opt/homebrew/opt/mariadb@11.4/lib/pkgconfig" >> $GITHUB_ENV

      - name: Env MacOS
        if: (matrix.os == 'macos-15-intel' || matrix.os == 'macos-15') && !startsWith(matrix.features, 'bundled')
        run: |
          echo "MYSQL_DATABASE_URL=mysql://runner@localhost/diesel_test" >> $GITHUB_ENV
          echo "MYSQL_EXAMPLE_DATABASE_URL=mysql://runner@localhost/diesel_example" >> $GITHUB_ENV
          echo "MYSQL_UNIT_TEST_DATABASE_URL=mysql://runner@localhost/diesel_unit_test" >> $GITHUB_ENV

      - name: Install MySQL (Windows)
        if: ${{ runner.os == 'Windows' && matrix.target == 'mysql' && !startsWith(matrix.features, 'bundled') }}
        shell: bash
        run: |
          curl -L https://dev.mysql.com/get/Downloads/MySQL-8.4/mysql-8.4.0-winx64.zip -o library.zip
          unzip library.zip

      - name: Install MariaDB (Windows)
        if: ${{ runner.os == 'Windows' && matrix.target == 'mariadb' }}
        shell: bash
        run: |
          curl -L https://archive.mariadb.org/mariadb-11.5.2/winx64-packages/mariadb-11.5.2-winx64.zip -o library.zip
          unzip library.zip

      - name: Set variables for mysql (Windows)
        if: ${{ runner.os == 'Windows' && matrix.target == 'mysql' && !startsWith(matrix.features, 'bundled') }}
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          echo "MYSQLCLIENT_LIB_DIR=$WORKSPACE/mysql-8.4.0-winx64/lib/" >> $GITHUB_ENV
          echo "MYSQLCLIENT_VERSION=8.4.0" >> $GITHUB_ENV
          echo "MYSQLCLIENT_INCLUDE_DIR=$WORKSPACE/mysql-8.4.0-winx64/include" >> $GITHUB_ENV
          dir ./mysql-8.4.0-winx64/lib
          dir ./mysql-8.4.0-winx64/include

      - name: Set variables for MariaDB (Windows)
        if: ${{ runner.os == 'Windows' && matrix.target == 'mariadb' }}
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          echo "MYSQLCLIENT_LIB_DIR=$WORKSPACE/mariadb-11.5.2-winx64/lib/" >> $GITHUB_ENV
          echo "MYSQLCLIENT_INCLUDE_DIR=$WORKSPACE/mariadb-11.5.2-winx64/include/mysql/" >> $GITHUB_ENV
          echo "MYSQLCLIENT_VERSION=11.5.2" >> $GITHUB_ENV
          echo "MYSQLCLIENT_LIBNAME=mariadbclient" >> $GITHUB_ENV
          dir ./mariadb-11.5.2-winx64/lib
          dir ./mariadb-11.5.2-winx64/include

      - name: Windows setup (bundled)
        if: ${{ runner.os == 'Windows' && startsWith(matrix.features, 'bundled') }}
        shell: bash
        run: |
          echo "OPENSSL_RUST_USE_NASM=0" >> $GITHUB_ENV
          echo OPENSSL_SRC_PERL=C:/Strawberry/perl/bin/perl >> $GITHUB_ENV

      - name: Install musl toolchain (Linux x86_64)
        if: ${{ runner.os == 'Linux' && matrix.rust_target == 'x86_64-unknown-linux-musl' }}
        shell: bash
        env:
          # Prebuilt musl gcc/g++ toolchain from https://toolchains.bootlin.com/
          # Ubuntu only packages a musl C compiler (musl-tools), but building
          # libmysqlclient requires a C++ compiler + libstdc++ for musl as well
          MUSL_TOOLCHAIN: x86-64--musl--stable-2026.08-1
          MUSL_TOOLCHAIN_SHA256: 78d3a4683d6ac47b5ee73bd5bce210b55eb93dff1b137c61298af97eb0d2b5a6
        run: |
          sudo apt-get update
          sudo apt-get -y install cmake make perl pkg-config xz-utils curl
          curl -fsSL --retry 5 --retry-all-errors \
            -o "$RUNNER_TEMP/$MUSL_TOOLCHAIN.tar.xz" \
            "https://toolchains.bootlin.com/downloads/releases/toolchains/x86-64/tarballs/$MUSL_TOOLCHAIN.tar.xz"
          echo "$MUSL_TOOLCHAIN_SHA256  $RUNNER_TEMP/$MUSL_TOOLCHAIN.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$MUSL_TOOLCHAIN.tar.xz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/$MUSL_TOOLCHAIN/relocate-sdk.sh" > /dev/null
          TOOLCHAIN_BIN="$RUNNER_TEMP/$MUSL_TOOLCHAIN/bin"
          PREFIX="$TOOLCHAIN_BIN/x86_64-buildroot-linux-musl"
          "$PREFIX-g++" --version
          echo "$TOOLCHAIN_BIN" >> $GITHUB_PATH
          echo "CC_x86_64_unknown_linux_musl=$PREFIX-gcc" >> $GITHUB_ENV
          echo "CXX_x86_64_unknown_linux_musl=$PREFIX-g++" >> $GITHUB_ENV
          echo "AR_x86_64_unknown_linux_musl=$PREFIX-ar" >> $GITHUB_ENV
          echo "RANLIB_x86_64_unknown_linux_musl=$PREFIX-ranlib" >> $GITHUB_ENV
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=$PREFIX-gcc" >> $GITHUB_ENV

      - name: Install musl toolchain (Linux aarch64)
        if: ${{ runner.os == 'Linux' && matrix.rust_target == 'aarch64-unknown-linux-musl' }}
        shell: bash
        env:
          # Bootlin only provides toolchains that run on x86_64 hosts.
          # Instead use an Alpine Linux root filesystem as sysroot
          # (musl, libstdc++ and the gcc runtime) and compile with the
          # host clang/lld
          ALPINE_VERSION: 3.24.4
          ALPINE_SHA256: 4b14c18f7e90a063b61462ea1462a5732c154bf6adad594974fe6487cd98a8de
          ARCH: aarch64
        run: |
          sudo apt-get update
          sudo apt-get -y install cmake make perl pkg-config curl clang lld llvm
          ROOTFS="$RUNNER_TEMP/alpine-$ARCH"
          TARBALL="$RUNNER_TEMP/alpine-minirootfs-$ALPINE_VERSION-$ARCH.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors -o "$TARBALL" \
            "https://dl-cdn.alpinelinux.org/alpine/v${ALPINE_VERSION%.*}/releases/$ARCH/alpine-minirootfs-$ALPINE_VERSION-$ARCH.tar.gz"
          echo "$ALPINE_SHA256  $TARBALL" | sha256sum -c -
          mkdir -p "$ROOTFS"
          tar -xzf "$TARBALL" -C "$ROOTFS"
          # host and rootfs share the same architecture, so apk can run in a chroot
          cp /etc/resolv.conf "$ROOTFS/etc/resolv.conf"
          sudo chroot "$ROOTFS" /sbin/apk add --no-cache g++ linux-headers
          GCC_DIR=$(echo "$ROOTFS"/usr/lib/gcc/$ARCH-alpine-linux-musl/*)
          BIN="$RUNNER_TEMP/musl-bin"
          mkdir -p "$BIN"
          for tool in gcc:clang g++:clang++; do
            cat > "$BIN/$ARCH-linux-musl-${tool%%:*}" <<EOF
          #!/bin/sh
          exec ${tool##*:} --target=$ARCH-alpine-linux-musl --sysroot="$ROOTFS" --gcc-install-dir="$GCC_DIR" -fuse-ld=lld "\$@"
          EOF
            chmod +x "$BIN/$ARCH-linux-musl-${tool%%:*}"
          done
          "$BIN/$ARCH-linux-musl-g++" --version
          echo "CC_aarch64_unknown_linux_musl=$BIN/$ARCH-linux-musl-gcc" >> $GITHUB_ENV
          echo "CXX_aarch64_unknown_linux_musl=$BIN/$ARCH-linux-musl-g++" >> $GITHUB_ENV
          echo "AR_aarch64_unknown_linux_musl=llvm-ar" >> $GITHUB_ENV
          echo "RANLIB_aarch64_unknown_linux_musl=llvm-ranlib" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=$BIN/$ARCH-linux-musl-gcc" >> $GITHUB_ENV

      - name: Install rust toolchain
        run: |
          rustup update stable
          rustup override set stable
          rustup component add rustfmt
          cargo --version
          rustc --version

      - name: Set cargo target
        if: ${{ matrix.rust_target != '' }}
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          rustup target add "$RUST_TARGET"
          # picked up by all following cargo invocations
          echo "CARGO_BUILD_TARGET=$RUST_TARGET" >> $GITHUB_ENV

      - name: Check
        shell: bash
        env:
          FEATURES: ${{ matrix.features }}
          OPENSSL: ${{ matrix.openssl }}
        run: |
          cargo check --no-default-features --features "$FEATURES" $OPENSSL --verbose

      - name: Tests
        shell: bash
        env:
          FEATURES: ${{ matrix.features }}
          OPENSSL: ${{ matrix.openssl }}
        run: |
          cargo test --no-default-features --features "$FEATURES" $OPENSSL

      - name: Test compile diesel
        shell: bash
        # allow to fail as diesel might not pull in the right feature yet
        continue-on-error: true
        env:
          FEATURES: ${{ matrix.features }}
          OPENSSL: ${{ matrix.openssl }}
        run: |
          cargo new test_diesel
          cd test_diesel
          echo "[workspace]" >> Cargo.toml
          cargo add diesel --no-default-features --features "mysql" --git "https://github.com/diesel-rs/diesel/" --branch "main"
          cargo add mysqlclient-sys openssl-sys@0.9.93
          echo "[patch.crates-io]" >> Cargo.toml
          echo "mysqlclient-sys = { path = \"..\" }" >> Cargo.toml
          cat Cargo.toml
          echo "use diesel::prelude::*;" > src/main.rs
          echo "fn main() { MysqlConnection::establish(\"foo\").unwrap(); }" >> src/main.rs
          cargo build --features "mysqlclient-sys/$FEATURES" $OPENSSL

      - name: Generated bindings.rs
        if: ${{ matrix.os != 'Windows' && !startsWith(matrix.features, 'bundled') }}
        shell: bash
        run: |
          find . -name bindings.rs -ls -exec cat {} \;

      - name: Test all files included
        shell: bash
        if: ${{ matrix.features == 'bundled' }}
        env:
          OPENSSL: ${{ matrix.openssl }}
        run: |
          rm -rf test_diesel
          git reset --hard HEAD
          cd mysqlclient-src
          cargo package $OPENSSL
